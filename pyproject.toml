[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-foundation"
version = "0.1.0"
description = "Versioned SupportOps domain, deterministic testkit, and LLM mode contracts."
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic==2.14.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
include = ["supportops_foundation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
