services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1::5432"]
  redis:
    image: redis:7.4.11
    ports: ["127.0.0.1::6379"]
  moto:
    image: motoserver/moto:5.2.5
    ports: ["127.0.0.1::5000"]
