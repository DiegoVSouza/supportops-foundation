services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1::5432"]
  redis:
    image: redis:7.4.11
    ports: ["127.0.0.1::6379"]
  localstack:
    image: localstack/localstack:2026.08.3
    environment:
      SERVICES: sqs,sns,s3
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1::4566"]
